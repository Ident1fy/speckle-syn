name: Sync Speckle Images to Aliyun ACR

on:
  workflow_dispatch:

jobs:
  sync-images:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-fpvz13dxk5z4gdp8.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Pull Quay MinIO and Push to ACR
        run: |
          set -e
          echo "Pulling official MinIO from Quay.io..."
          docker pull quay.io/minio/minio:RELEASE.2023-09-07T02-05-02Z
          docker tag quay.io/minio/minio:RELEASE.2023-09-07T02-05-02Z crpi-fpvz13dxk5z4gdp8.cn-hangzhou.personal.cr.aliyuncs.com/speckle-server/speckle-server:minio
          docker push crpi-fpvz13dxk5z4gdp8.cn-hangzhou.personal.cr.aliyuncs.com/speckle-server/speckle-server:minio
