name: Sync Speckle Images to Aliyun ACR

on:
  workflow_dispatch:

jobs:
  sync-images:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-fpvz13dxk5z4gdp8.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Pull and Push MinIO via GHCR
        run: |
          set -e
          echo "Pulling official MinIO from GitHub Container Registry (ghcr.io)..."
          docker pull ghcr.io/minio/minio:latest
          docker tag ghcr.io/minio/minio:latest crpi-fpvz13dxk5z4gdp8.cn-hangzhou.personal.cr.aliyuncs.com/speckle-server/speckle-server:minio
          docker push crpi-fpvz13dxk5z4gdp8.cn-hangzhou.personal.cr.aliyuncs.com/speckle-server/speckle-server:minio
