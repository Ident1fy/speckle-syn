name: Sync Speckle Images to Aliyun ACR

on:
  workflow_dispatch:

jobs:
  sync-images:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-fpvz13dxk5z4gdp8.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push MinIO Image
        run: |
          set -e
          echo "Downloading official MinIO from dl.min.io direct CDN..."
          curl -fSL https://dl.min.io/server/minio/release/linux-amd64/minio -o minio
          chmod +x minio

          echo "Creating Dockerfile..."
          cat << 'EOF' > Dockerfile.minio
          FROM alpine:3.18
          RUN apk add --no-cache ca-certificates libc6-compat
          COPY minio /usr/bin/minio
          EXPOSE 9000 9001
          ENTRYPOINT ["minio"]
          VOLUME ["/data"]
          CMD ["server", "/data", "--console-address", ":9001"]
          EOF

          echo "Building MinIO image locally..."
          docker build -f Dockerfile.minio -t crpi-fpvz13dxk5z4gdp8.cn-hangzhou.personal.cr.aliyuncs.com/speckle-server/speckle-server:minio .

          echo "Pushing MinIO image to ACR..."
          docker push crpi-fpvz13dxk5z4gdp8.cn-hangzhou.personal.cr.aliyuncs.com/speckle-server/speckle-server:minio
