name: Sync Speckle Images to Aliyun ACR

on:
  workflow_dispatch:

jobs:
  sync-images:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-fpvz13dxk5z4gdp8.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push MinIO
        run: |
          set -e
          echo "Cloning MinIO repository..."
          git clone --depth 1 https://github.com/minio/minio.git minio-src

          echo "Compiling MinIO binary from source..."
          cd minio-src
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -tags kqueue -o ../minio
          cd ..

          echo "Creating runtime Dockerfile..."
          cat << 'EOF' > Dockerfile.minio
          FROM alpine:3.18
          RUN apk add --no-cache ca-certificates libc6-compat
          COPY minio /usr/bin/minio
          EXPOSE 9000 9001
          ENTRYPOINT ["minio"]
          VOLUME ["/data"]
          CMD ["server", "/data", "--console-address", ":9001"]
          EOF

          echo "Building Docker image..."
          docker build -f Dockerfile.minio -t crpi-fpvz13dxk5z4gdp8.cn-hangzhou.personal.cr.aliyuncs.com/speckle-server/speckle-server:minio .

          echo "Pushing MinIO to Aliyun ACR..."
          docker push crpi-fpvz13dxk5z4gdp8.cn-hangzhou.personal.cr.aliyuncs.com/speckle-server/speckle-server:minio
